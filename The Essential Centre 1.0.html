<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Homepage</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Monsterrat,Helvetica,sans-serif;
}

body{
    background:#121212;
    color:white;
    min-height:100vh;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.settings{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    margin-bottom:40px;
}

.switch{
    position:relative;
    width:60px;
    height:34px;
}

.switch input{
    opacity:0;
    width:0;
    height:0;
}

.slider{
    position:absolute;
    inset:0;
    cursor:pointer;
    background:#555;
    transition:.4s;
    border-radius:34px;
}

.slider:before{
    content:"";
    position:absolute;
    width:26px;
    height:26px;
    left:4px;
    bottom:4px;
    background:white;
    border-radius:50%;
    transition:.4s;
}

input:checked + .slider{
    background:#4CAF50;
}

input:checked + .slider:before{
    transform:translateX(26px);
}

.site-grid{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
}

.site-btn{
    background:#1e1e1e;
    border:1px solid #333;
    border-radius:15px;
    color:white;
    cursor:pointer;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
    transition:0.3s;
}

.site-btn:hover{
    transform:translateY(-5px);
    background:#292929;
    border-color:#4CAF50;
}

.logo{
    width:60px;
    height:60px;
    background:white;
    border-radius:12px;
    padding:8px;
    object-fit:contain;
}

.site-name{
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>Welcome to the Essential Centre</h1>

<div class="settings">
    <span>Same Tab</span>

    <label class="switch">
        <input type="checkbox" id="tabToggle" checked>
        <span class="slider"></span>
    </label>

    <span>New Tab</span>
</div>

<div class="site-grid">

    <button class="site-btn"
        onclick="openSite('https://www.google.com')">
        <img class="logo"
        src="https://www.google.com/s2/favicons?domain=google.com&sz=128">Google</span>
    </button>

    <button class="site-btn"
        onclick="openSite('https://www.youtube.com')">
        <img class="logo"
        src="https://thumb.wikimedia.org/wikipedia/commons/thumb/0/09/YouTube_full-color_icon_%282017%29.svg/960px-YouTube_full-color_icon_%282017%29.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail&_=20240107144800"
        <span class="site-name">YouTube</span>
    </button>

    <button class="site-btn"
        onclick="openSite('https://www.duolingo.com')">
        <img class="logo" src="https://d35aaqx5ub95lt.cloudfront.net/vendor/0cecd302cf0bcd0f73d51768feff75fe.svg" s2="" favicons?domain="duolingo.com&amp;sz=128" <span="">        <span class="site-name">Duolingo</span>
    </button>

    <button class="site-btn"
        onclick="openSite('https://web.cloudmoonapp.com')">
        <img class="logo"
        src="https://web.cloudmoonapp.com/images/logo.png"      <span class="site-name">CloudMoon</span>
    </button>

    <button class="site-btn"
        onclick="openSite('https://www.minecraft.net')">
        <img class="logo"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUKuOquHDeUgrLcIetSA4g-uf7BslxaoUidDwDWy3qwg&s=10">Minecraft</span>
    </button>

    <button class="site-btn"
        onclick="openSite('https://outlook.live.com')">
        <img class="logo"
        src="https://www.google.com/s2/favicons?domain=outlook.live.com&sz=128">
 Outlook</span>
    </button>

</div>

<script>
function openSite(url)
{
    const openInNewTab =
        document.getElementById("tabToggle").checked;

    if(openInNewTab)
    {
        window.open(url,"_blank");
    }
    else
    {
        window.location.href = url;
    }
}
</script>

</body>
</html>
