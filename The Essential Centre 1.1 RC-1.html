<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Essential Centre</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Montserrat,Arial,sans-serif;
}

body{
    min-height:100vh;
    padding:40px;
    color:white;
    transition:.4s;
}

/* THEMES */

.theme-dark{
    background:#121212;
}

.theme-space{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.theme-ocean{
    background:linear-gradient(135deg,#006994,#0093E9);
}

.theme-purple{
    background:linear-gradient(135deg,#41295a,#2f0743);
}

.theme-forest{
    background:linear-gradient(135deg,#134E5E,#71B280);
}

.theme-sunset{
    background:linear-gradient(135deg,#ff512f,#dd2476);
}

.theme-fire{
    background:linear-gradient(135deg,#ff4e50,#f9d423);
}

.theme-midnight{
    background:linear-gradient(135deg,#232526,#414345);
}

.theme-neon{
    background:linear-gradient(135deg,#00F260,#0575E6);
}

.theme-galaxy{
    background:linear-gradient(135deg,#20002c,#cbb4d4);
}

.theme-ice{
    background:linear-gradient(135deg,#83a4d4,#b6fbff);
}

/* HEADER */

h1{
    text-align:center;
    margin-bottom:30px;
    font-size:2.2rem;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:25px;
    flex-wrap:wrap;
    margin-bottom:40px;
}

/* TAB SWITCH */

.tab-setting{
    display:flex;
    align-items:center;
    gap:12px;
}

.switch{
    position:relative;
    display:inline-block;
    width:60px;
    height:34px;
}

.switch input{
    opacity:0;
    width:0;
    height:0;
}

.slider{
    position:absolute;
    inset:0;
    cursor:pointer;
    background:#444;
    border-radius:999px;
    transition:.3s;
}

.slider:before{
    content:"";
    position:absolute;
    left:4px;
    top:4px;
    width:26px;
    height:26px;
    border-radius:50%;
    background:white;
    transition:.3s;
}

input:checked + .slider{
    background:#4CAF50;
    box-shadow:0 0 15px rgba(76,175,80,.5);
}

input:checked + .slider:before{
    transform:translateX(26px);
}

#tabModeText{
    min-width:90px;
    font-weight:600;
}

/* THEME SELECT */

select{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    background:white;
    cursor:pointer;
    font-size:14px;
}

/* GRID */

.site-grid{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
}

/* CARDS */

.site-btn{
    background:rgba(0,0,0,.25);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;

    padding:25px;
    color:white;

    cursor:pointer;

    display:flex;
    flex-direction:column;
    align-items:center;

    transition:.25s;
}

.site-btn:hover{
    transform:translateY(-6px);
    border-color:#4CAF50;
}

.logo{
    width:64px;
    height:64px;
    margin-bottom:15px;
}

.site-name{
    font-size:18px;
    font-weight:600;
}

footer{
    text-align:center;
    margin-top:40px;
    opacity:.75;
    font-size:14px;
}

@media(max-width:600px){

    body{
        padding:20px;
    }

    h1{
        font-size:1.6rem;
    }
}

</style>
</head>

<script>

const tabToggle =
document.getElementById("tabToggle");

const tabModeText =
document.getElementById("tabModeText");

function updateTabMode()
{
    tabModeText.textContent =
    tabToggle.checked
        ? "New Tab"
        : "Current Tab";
}

function openSite(url)
{
    if(tabToggle.checked)
    {
        window.open(url,"_blank");
    }
    else
    {
        window.location.href = url;
    }
}

tabToggle.addEventListener(
    "change",
    updateTabMode
);

updateTabMode();

/* Theme Picker */

const themePicker =
document.getElementById("themePicker");

themePicker.addEventListener("change", () =>
{
    document.body.className =
    themePicker.value;
});

</script>
